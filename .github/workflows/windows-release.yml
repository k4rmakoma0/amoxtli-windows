name: Windows installer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-release.yml'
      - 'scripts/**'
      - 'installer/**'
      - 'signing/**'
      - '**/*.cs'
      - '**/*.xaml'
      - '*.csproj'
      - 'Package.appxmanifest'
      - 'LICENSE'
      - 'PRIVACY.md'
  workflow_dispatch:
    inputs:
      version:
        description: Installer version (major.minor.patch)
        type: string
        default: '2.0.0'
        required: true
      sign:
        description: Request production signing (requires SignPath approval and configuration)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      REQUEST_SIGNING: ${{ inputs.sign }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate configuration
        id: config
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_PAYLOAD_CONFIGURATION: ${{ vars.SIGNPATH_PAYLOAD_CONFIGURATION }}
          SIGNPATH_INSTALLER_CONFIGURATION: ${{ vars.SIGNPATH_INSTALLER_CONFIGURATION }}
        run: |
          if (-not $env:RELEASE_VERSION) {
            [xml]$manifest = Get-Content Package.appxmanifest -Raw
            $version = [version]$manifest.Package.Identity.Version
            $env:RELEASE_VERSION = '{0}.{1}.{2}' -f $version.Major, $version.Minor, $version.Build
          }
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version.' }
          "RELEASE_VERSION=$env:RELEASE_VERSION" | Add-Content $env:GITHUB_ENV
          "release-version=$env:RELEASE_VERSION" | Add-Content $env:GITHUB_OUTPUT
          if ($env:REQUEST_SIGNING -eq 'true') {
            if ($env:GITHUB_REF -ne 'refs/heads/main' -and $env:GITHUB_REF -notlike 'refs/tags/v*') {
              throw 'Production signing is only allowed on main or a version tag.'
            }
            foreach ($name in @('SIGNPATH_API_TOKEN','SIGNPATH_ORGANIZATION_ID','SIGNPATH_PROJECT_SLUG','SIGNPATH_SIGNING_POLICY_SLUG','SIGNPATH_PAYLOAD_CONFIGURATION','SIGNPATH_INSTALLER_CONFIGURATION')) {
              if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Configure $name after SignPath approval." }
            }
          }

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Prepare portable Inno Setup compiler
        id: compiler
        shell: pwsh
        run: ./scripts/Get-InnoCompiler.ps1

      - name: Build unsigned installer sample
        if: ${{ !inputs.sign }}
        shell: pwsh
        run: ./scripts/Build-Installer.ps1 -Version $env:RELEASE_VERSION -CompilerPath '${{ steps.compiler.outputs.compiler-path }}'

      - name: Upload unsigned sample
        if: ${{ !inputs.sign }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: amoxtli-windows-unsigned-${{ steps.config.outputs.release-version }}
          path: artifacts/releases/*
          if-no-files-found: error

      - name: Check signing safeguards
        if: ${{ !inputs.sign }}
        shell: pwsh
        run: ./scripts/Test-Signing.ps1 -UnsignedInstaller "artifacts/releases/Amoxtli-$env:RELEASE_VERSION-windows-x64-setup.exe" -CompilerPath '${{ steps.compiler.outputs.compiler-path }}'

      - name: Prepare app and uninstaller for signing
        if: ${{ inputs.sign }}
        id: payload
        shell: pwsh
        run: ./scripts/Build-Installer.ps1 -Version $env:RELEASE_VERSION -CompilerPath '${{ steps.compiler.outputs.compiler-path }}' -PrepareSigning

      - name: Upload unsigned signing input
        if: ${{ inputs.sign }}
        id: payload-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: amoxtli-payload-unsigned-${{ steps.config.outputs.release-version }}
          path: ${{ steps.payload.outputs.payload-directory }}
          if-no-files-found: error

      - name: Sign app and uninstaller
        if: ${{ inputs.sign }}
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_PAYLOAD_CONFIGURATION }}
          parameters: |
            version: ${{ toJSON(steps.config.outputs.release-version) }}
          github-artifact-id: ${{ steps.payload-upload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: artifacts/signed-payload

      - name: Package the signed app and uninstaller
        if: ${{ inputs.sign }}
        id: installer
        shell: pwsh
        run: ./scripts/Complete-SignPathPayload.ps1 -BuildStatePath '${{ steps.payload.outputs.build-state }}' -SignedPayloadDirectory artifacts/signed-payload -CompilerPath '${{ steps.compiler.outputs.compiler-path }}'

      - name: Upload installer for signing
        if: ${{ inputs.sign }}
        id: installer-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: amoxtli-installer-to-sign-${{ steps.config.outputs.release-version }}
          path: ${{ steps.installer.outputs.installer-path }}
          if-no-files-found: error

      - name: Sign installer
        if: ${{ inputs.sign }}
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_CONFIGURATION }}
          parameters: |
            version: ${{ toJSON(steps.config.outputs.release-version) }}
          github-artifact-id: ${{ steps.installer-upload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: artifacts/signed-release

      - name: Verify release signature and write final checksum
        if: ${{ inputs.sign }}
        shell: pwsh
        run: ./scripts/Finalize-SignedRelease.ps1 -Directory artifacts/signed-release -Version $env:RELEASE_VERSION

      - name: Upload verified signed release
        if: ${{ inputs.sign }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: amoxtli-windows-signed-${{ steps.config.outputs.release-version }}
          path: artifacts/signed-release/*
          if-no-files-found: error
